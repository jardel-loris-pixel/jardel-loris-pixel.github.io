<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci de votre intérêt</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            /* On reprend le dégradé de ta section final-cta */
            background-image: url(phone-background1.png);
            background-size: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Effet de lueur d'arrière-plan comme sur ta Home */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-family: 'roboto', serif;
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn-home {
            display: inline-block;
            padding: 15px 40px;
            background: #891069; /* Ton violet principal */
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon"></div>
        <h1>Et c'est parti !</h1>
        <p>
            Votre adresse email a bien été enregistrée.<br>
            Je vous tiendrai informé de l'évolution du projet.
        </p>
        <a href="landing-page-project-2.html" class="btn-home">Retour au site</a>
    </div>

</body>
</html>
